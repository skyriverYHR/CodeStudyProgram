spring.application.name=SpringBootStudy

#First 1
#Mysql DataBase connection setting-------------------------------
#sprinboot will default to load databases.If you not give settings, it will error.
# connection URL
spring.datasource.url=jdbc:mysql://localhost:3306/expenditure
# username
spring.datasource.username=root
# password
spring.datasource.password=123456
# driver
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
#----------------------------------------------------------------

#Second
#Mybatis setting-------------------------------------------------
# scan fact-class
mybatis.type-aliases-package = io.github.skyriveryhr.springbootstudy.entity
# scan sql-language
mybatis.mapper-locations = classpath:mapper/*.xml


#Random value
school.name = SkyRiver Academy
my.name = sky
my.id = 1